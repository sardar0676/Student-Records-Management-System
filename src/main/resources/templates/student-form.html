<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${editing} ? 'Edit Student' : 'Add Student'">Student Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        label { display: block; margin-top: 12px; }
        input { padding: 5px; width: 250px; }
        .error { color: #b00020; font-weight: bold; }
        button { margin-top: 16px; padding: 6px 14px; }
    </style>
</head>
<body>
    <h1 th:text="${editing} ? 'Edit Student' : 'Add New Student'">Student Form</h1>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form method="post"
          th:action="${editing} ? @{/students/{r}/update(r=${student.regNo})} : @{/students}">

        <label>Reg No
            <input type="text" name="regNo" th:value="${student.regNo}"
                   th:readonly="${editing}" maxlength="20" required>
        </label>

        <label>Name
            <input type="text" name="name" th:value="${student.name}" maxlength="100" required>
        </label>

        <label>Department
            <input type="text" name="department" th:value="${student.department}" maxlength="50" required>
        </label>

        <label>CGPA (0.0 - 4.0)
            <input type="number" name="cgpa" step="0.01" min="0" max="4"
                   th:value="${student.cgpa}" required>
        </label>

        <button type="submit" th:text="${editing} ? 'Save Changes' : 'Add Student'">Save</button>
        <a th:href="@{/students}">Cancel</a>
    </form>
</body>
</html>
